name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 1.2.0 (stable) or 1.2.0-beta.1 (pre-release)"
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        env:
          VERSION_NAME: ${{ inputs.version }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Banafsh-sstp-${VERSION_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          NOTES_FILE="release_notes/${VERSION_NAME}.md"
          {
            if [ -f "$NOTES_FILE" ]; then
              cat "$NOTES_FILE"
            else
              echo "Banafsh-sstp ${VERSION_NAME}"
            fi
            printf '\n\n---\n'
            echo "هنگام نصب، Google Play Protect ممکن است هشدار بدهد؛ گزینه‌ی Install anyway را بزنید."
            echo "Google Play Protect may show a warning on install; tap Install anyway."
          } > release_body.md

          FLAGS=""
          case "$VERSION_NAME" in
            *-*) FLAGS="--prerelease" ;;
          esac

          gh release create "v${VERSION_NAME}" "Banafsh-sstp-${VERSION_NAME}.apk" \
            --title "Banafsh-sstp ${VERSION_NAME}" \
            --notes-file release_body.md \
            $FLAGS
