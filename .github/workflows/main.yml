name: Build APK

on:
  workflow_dispatch:
    inputs:
      test_on_tv:
        description: Test remote navigation and the connection flow on an Android TV emulator
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Prepare installable TV APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Banafsh-TV-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/Banafsh-TV-debug.apk
          archive: false
          if-no-files-found: error
      - name: Compile TV smoke tests
        if: inputs.test_on_tv
        run: bash gradlew :app:assembleDebugAndroidTest
      - name: Enable KVM
        if: inputs.test_on_tv
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android TV
        if: inputs.test_on_tv
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          script: bash gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.loopbackTunnel=true
      - name: Report TV test failures
        if: failure() && inputs.test_on_tv
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for report in Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  for error in case.findall('failure') + case.findall('error'):
                      message = error.get('message') or error.text or 'Test failed'
                      print(f"::error title={case.get('name')}::{message[:1800].replace('%', '%25').replace(chr(10), '%0A')}")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: failure() && inputs.test_on_tv
        with:
          name: Android-TV-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
